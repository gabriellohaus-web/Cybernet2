<!DOCTYPE html>
<html lang="es">
<head>
    <title>CyberCafe Login</title>
    <link rel="stylesheet" href="estilo.css"> 
</head>
<body>

    <header>
        <nav>
            <h2>CyberCafe</h2>
        </nav>
    </header>
<main>
    <h1>Iniciar Sesión</h1>

    <form action="#" method="POST">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="usuario@gmail.com" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="*********" required>

        <button type="button" class="btn-encargado" onclick="window.location.href='encargado.html'">
            Ingresar como Encargado
        </button>
        
        <button type="button" class="btn-admin" onclick="window.location.href='admin.html'">
            Ingresar como Administrador
        </button>
    </form>
</main>
        

</body>
</html>
